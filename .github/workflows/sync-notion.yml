name: Sync Notion

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call sync endpoint
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 15 --retry-connrefused \
            --max-time 180 \
            -X POST "${{ secrets.SERVER_URL }}/internal/sync-notion" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
